# Include only inside the existing HTTPS server block.
location = /idea-notes { return 301 /idea-notes/$is_args$args; }

location ^~ /idea-notes/ {
    proxy_pass http://127.0.0.1:3102/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Authorization "";
    proxy_connect_timeout 5s;
    proxy_read_timeout 150s;
    client_max_body_size 1m;
    add_header Cache-Control "private, no-cache" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; worker-src 'self'; manifest-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    access_log off;
}
